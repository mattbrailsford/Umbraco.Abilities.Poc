<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 528" role="img" aria-label="Surfaces call abilities; packages declare abilities and entity adapters" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <style>
    .bg { fill: #ffffff; stroke: #d1d9e0; }
    .ink { fill: #1f2328; } .quiet { fill: #59636e; }
    .box { fill: none; stroke: #8c959f; stroke-width: 1.25; }
    .group { fill: none; stroke: #d1d9e0; stroke-width: 1.25; }
    .new { fill: #0969da; fill-opacity: 0.1; stroke: #0969da; stroke-width: 2; }
    .line { fill: none; stroke: #8c959f; stroke-width: 1.25; }
    .head { fill: #8c959f; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; stroke: #3d444d; }
      .ink { fill: #e6edf3; } .quiet { fill: #9198a1; }
      .box, .line { stroke: #6e7681; } .head { fill: #6e7681; }
      .group { stroke: #3d444d; }
      .new { fill: #4493f8; fill-opacity: 0.15; stroke: #4493f8; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>
  <rect class="bg" x="0.5" y="0.5" width="759" height="527" rx="8"/>

  <text class="ink" x="24" y="32" font-size="15" font-weight="600">Surfaces call abilities; packages declare them</text>

  <!-- Surfaces -->
  <rect class="group" x="24" y="52" width="712" height="80" rx="8"/>
  <text class="quiet" x="40" y="72" font-size="11.5">Surfaces</text>
  <rect class="box" x="44" y="84" width="160" height="32" rx="8"/>
  <text class="ink" x="124" y="104" text-anchor="middle">Create action</text>
  <rect class="box" x="216" y="84" width="160" height="32" rx="8"/>
  <text class="ink" x="296" y="104" text-anchor="middle">Copilot</text>
  <rect class="box" x="388" y="84" width="160" height="32" rx="8"/>
  <text class="ink" x="468" y="104" text-anchor="middle">Automate</text>
  <rect class="box" x="560" y="84" width="160" height="32" rx="8"/>
  <text class="ink" x="640" y="104" text-anchor="middle">MCP</text>

  <!-- Vertical chain -->
  <path class="line" d="M244 132V158" marker-end="url(#arrow)"/>
  <path class="line" d="M244 216V254" marker-end="url(#arrow)"/>
  <text class="quiet" x="254" y="239" font-size="11.5">calls</text>
  <path class="line" d="M244 312V350" marker-end="url(#arrow)"/>
  <text class="quiet" x="254" y="335" font-size="11.5">derived from</text>
  <path class="line" d="M244 408V446" marker-end="url(#arrow)"/>
  <text class="quiet" x="254" y="431" font-size="11.5">edits recorded in</text>

  <rect class="box" x="24" y="160" width="440" height="56" rx="8"/>
  <text class="ink" x="244" y="184" text-anchor="middle" font-weight="600">Creation prompts (Umbraco.AI)</text>
  <text class="quiet" x="244" y="200" text-anchor="middle" font-size="11.5">Agent loop: build in steps, check, fix, show for review</text>

  <rect class="box" x="24" y="256" width="440" height="56" rx="8"/>
  <text class="ink" x="244" y="280" text-anchor="middle" font-weight="600">1 · Abilities</text>
  <text class="quiet" x="244" y="296" text-anchor="middle" font-size="11.5">Operations and events, plus the generic entity abilities</text>

  <rect class="new" x="24" y="352" width="440" height="56" rx="8"/>
  <text class="ink" x="244" y="376" text-anchor="middle" font-weight="600">2 · Entity adapters (new)</text>
  <text class="ink" x="244" y="392" text-anchor="middle" font-size="11.5">Fields (values or typed items), references, item type registry</text>

  <rect class="new" x="24" y="448" width="440" height="56" rx="8"/>
  <text class="ink" x="244" y="472" text-anchor="middle" font-weight="600">3 · Change sets (generalised)</text>
  <text class="ink" x="244" y="488" text-anchor="middle" font-size="11.5">Recorded Write ability calls, applied product by product</text>

  <!-- Packages -->
  <rect class="box" x="520" y="256" width="216" height="152" rx="8"/>
  <text class="ink" x="628" y="286" text-anchor="middle" font-weight="600">Packages</text>
  <text class="ink" x="628" y="310" text-anchor="middle" font-size="11.5">CMS content, Commerce,</text>
  <text class="ink" x="628" y="326" text-anchor="middle" font-size="11.5">Automate, third parties</text>
  <text class="quiet" x="628" y="354" text-anchor="middle" font-size="11.5" font-style="italic">Declare abilities, entity</text>
  <text class="quiet" x="628" y="370" text-anchor="middle" font-size="11.5" font-style="italic">adapters and item types</text>
  <path class="line" d="M520 284H466" marker-end="url(#arrow)"/>
  <path class="line" d="M520 380H466" marker-end="url(#arrow)"/>

  <!-- Key -->
  <rect class="new" x="520" y="468" width="16" height="16" rx="4"/>
  <text class="quiet" x="546" y="481" font-size="11.5">New or generalised here</text>
</svg>
