<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 398" role="img" aria-label="Every surface uses one set of tools, built on three layers" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <style>
    .bg { fill: #ffffff; stroke: #d1d9e0; }
    .ink { fill: #1f2328; } .quiet { fill: #59636e; }
    .box { fill: none; stroke: #8c959f; stroke-width: 1.25; }
    .new { fill: #0969da; fill-opacity: 0.1; stroke: #0969da; stroke-width: 2; }
    .line { fill: none; stroke: #8c959f; stroke-width: 1.25; }
    .head { fill: #8c959f; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; stroke: #3d444d; }
      .ink { fill: #e6edf3; } .quiet { fill: #9198a1; }
      .box, .line { stroke: #6e7681; } .head { fill: #6e7681; }
      .new { fill: #4493f8; fill-opacity: 0.15; stroke: #4493f8; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>
  <rect class="bg" x="0.5" y="0.5" width="759" height="397" rx="8"/>

  <text class="ink" x="24" y="32" font-size="15" font-weight="600">Every surface uses one set of tools, built on three layers</text>

  <!-- Surfaces -->
  <rect class="box" x="24" y="56" width="160" height="40" rx="8"/>
  <text class="ink" x="104" y="80" text-anchor="middle">Backoffice</text>
  <rect class="box" x="204" y="56" width="160" height="40" rx="8"/>
  <text class="ink" x="284" y="80" text-anchor="middle">Umbraco.AI</text>
  <rect class="box" x="384" y="56" width="160" height="40" rx="8"/>
  <text class="ink" x="464" y="80" text-anchor="middle">MCP clients</text>
  <rect class="box" x="564" y="56" width="160" height="40" rx="8"/>
  <text class="ink" x="644" y="80" text-anchor="middle">Automate</text>

  <!-- Connectors -->
  <path class="line" d="M104 96V122" marker-end="url(#arrow)"/>
  <path class="line" d="M284 96V122" marker-end="url(#arrow)"/>
  <path class="line" d="M464 96V122" marker-end="url(#arrow)"/>
  <path class="line" d="M644 96V122" marker-end="url(#arrow)"/>
  <path class="line" d="M134 180V210" marker-end="url(#arrow)"/>
  <path class="line" d="M374 180V210" marker-end="url(#arrow)"/>
  <path class="line" d="M614 180V210" marker-end="url(#arrow)"/>
  <path class="line" d="M134 316V286" marker-end="url(#arrow)"/>
  <path class="line" d="M374 316V286" marker-end="url(#arrow)"/>

  <!-- Tools -->
  <rect class="box" x="24" y="124" width="700" height="56" rx="8"/>
  <text class="ink" x="374" y="148" text-anchor="middle" font-weight="600">One set of tools</text>
  <text class="quiet" x="374" y="166" text-anchor="middle" font-size="11.5">entity tools, change set tools, and each product's own abilities</text>

  <!-- Layers -->
  <rect class="box" x="24" y="212" width="220" height="72" rx="8"/>
  <text class="ink" x="134" y="236" text-anchor="middle" font-weight="600">Abilities</text>
  <text class="quiet" x="134" y="254" text-anchor="middle" font-size="11.5">Operations, declared once</text>
  <text class="quiet" x="134" y="270" text-anchor="middle" font-size="11.5">The Abilities proposal</text>

  <rect class="new" x="264" y="212" width="220" height="72" rx="8"/>
  <text class="ink" x="374" y="236" text-anchor="middle" font-weight="600">Entity adapters</text>
  <text class="ink" x="374" y="254" text-anchor="middle" font-size="11.5">What an entity looks like,</text>
  <text class="ink" x="374" y="270" text-anchor="middle" font-size="11.5">and how to load and save it</text>

  <rect class="new" x="504" y="212" width="220" height="72" rx="8"/>
  <text class="ink" x="614" y="236" text-anchor="middle" font-weight="600">Change sets</text>
  <text class="ink" x="614" y="254" text-anchor="middle" font-size="11.5">Write calls held back for review</text>
  <text class="ink" x="614" y="270" text-anchor="middle" font-size="11.5">Draft Sets, for any product</text>

  <!-- Packages -->
  <rect class="box" x="24" y="318" width="460" height="56" rx="8"/>
  <text class="ink" x="254" y="342" text-anchor="middle" font-weight="600">Packages: CMS, Commerce, Automate, third parties</text>
  <text class="quiet" x="254" y="360" text-anchor="middle" font-size="11.5">declare abilities and entity adapters, nothing per surface</text>

  <!-- Key -->
  <rect class="new" x="504" y="334" width="16" height="16" rx="4"/>
  <text class="quiet" x="530" y="347" font-size="11.5">New in this work</text>
</svg>
